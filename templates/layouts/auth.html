<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
        />
        <title>ACLC College | LMS Login</title>
        <style>
            body {
                position: relative;
                background-image: url("/static/img/background_login.png"); /* Replace 'path/to/your/image.jpg' with the actual path to your image file */
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                height: 100vh;
                margin: 0;
            }

            .overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(
                    0,
                    0,
                    0,
                    0.7
                ); /* Adjust the opacity by changing the last value (0 to 1) */
            }
        </style>
    </head>
    <body>
        <div class="overlay">{% block body %} {% endblock %}</div>
    </body>
</html>
