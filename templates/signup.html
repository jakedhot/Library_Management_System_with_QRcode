{% extends 'layouts/auth.html' %}

{% block body %}
<div class="d-flex justify-content-center align-items-center p-5 overflow-hidden" style="min-height: 100vh;">
    <form id="myForm" action="{{ url_for('register') }}" method="post" class="shadow-lg bg-white p-4 rounded-4 h-50">
        <div class="mb-3">
            <h1><span class="badge rounded-pill text-bg-primary ">Signup</span></h1>
        </div>
        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="d-flex gap-5">
            <!-- Left -->
            <div class="mt-2">
                <div class="mb-1">
                    <label for="fname" class="form-label">First Name</label>
                    <input type="text" name="fname" class="form-control" id="fname" placeholder="First Name" required>
                </div>
                <div class="mb-1">
                    <label for="mname" class="form-label">Middle Name</label>
                    <input type="text" name="mname" class="form-control" id="mname" placeholder="Middle Name" required>
                </div>
                <div class="mb-1">
                    <label for="lname" class="form-label">Last Name</label>
                    <input type="lname" name="lname" class="form-control" id="lname" placeholder="Last Name" required>
                </div>
            </div>
            <!-- Right -->
            <div class="mt-2">
                <div class="mb-1">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" id="email" placeholder="johndoe@gmail.com" required>
                </div>
                <div class="mb-1">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="password" required>
                </div>
            </div>
        </div>
        <div class="mb-1">
            <label for="contact" class="form-label">Contact</label>
            <input type="text" name="contact" class="form-control" placeholder="09***********" id="contact" required>
        </div>
        <div class="mb-1">
            <label for="datebirth" class="form-label">Datebirth</label>
            <input type="date" name="dateBirth" class="form-control" id="dateBirth" required>
        </div>
        <div class="mb-1">
            <label for="address" class="form-label">Address</label>
            <input type="text" name="address" class="form-control" placeholder="Complete Address" id="address" required>
        </div>
        <div class="d-flex justify-content-between mt-3">
            <a href="/">Already have an account?</a>
            <input type="submit" value="Submit" class="btn btn-primary">
        </div>
    </form>
</div>
{% endblock %}
