{% extends 'layouts/auth.html' %}

{% block body %}
<div class="container-fluid text-white vh-100 user-select-none">
  <div class="d-flex align-items-center gap-3 pt-4 px-5">
    <img src="/static/img/aclc_logo.png" width="90" height="90" alt="Logo">
    <div class="vr"></div>
    <h1>ACLC College of Butuan</h1>
  </div>

  <div class="d-flex px-5 py-3 mt-5 gap-5">
    <div class="">
      <h1 class="display-1 text-wrap px-5 text-start fw-bold mb-5">LIBRARY MANAGEMENT SYSTEM</h1>
  
      <div class="float-end">
        <p class="fs-2 font-monospace">"A Library is infinity under a roof"</p>
        <h3 class="text-end">- Gail Levine</h3>
      </div>
    </div>

    <div class="card text-center w-50 rounded-5 shadow-lg p-3" style="background-color: #131F6B;">
      <div class="card-body">
        <h5 class="p-3 text-white">Good Day, User!</h5>
        <div class="card-img mb-3 p-4">
          <img src="/static/img/user.png" alt="user">
        </div>

        <form action="/login_process" method="post">
          <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input name="email" type="email" class="form-control" placeholder="Email" aria-label="Username" aria-describedby="basic-addon1">
          </div>
  
          <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">#</span>
            <input name="password" type="password" class="form-control" placeholder="Password" aria-label="Password" aria-describedby="basic-addon1">
          </div>
          <div class="d-flex gap-3 justify-content-center">
            <a href="/register" class="btn btn-primary">Register</a>
            <input type="submit" value="Login" class="btn btn-primary">
          </div>
        </form>
      </div>
    </div>
  </div>

</div>
{% endblock %}
