{% extends 'layouts/user.html' %} {% block body %}
<style>
    .scrollable-table {
        max-height: 520px;
        overflow-y: auto;
    }
    thead {
        position: sticky;
        top: 0;
        background-color: white;
        z-index: 1;
    }
</style>

<div class="container-fluid p-4">
    <div
        class="card-header d-flex justify-content-between align-items-center align"
    >
        <h1>Returned Books</h1>

        <div class="d-flex align-items-center mt">
            <div class="container mt-0">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <i class="fas fa-search"></i>
                    </div>
                    <input
                        type="text"
                        class="form-control"
                        style="width: 200px"
                        placeholder="Search..."
                        aria-label="Search"
                        aria-describedby="basic-addon1"
                    />
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="table-responsive scrollable-table">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <thead class="table-dark sticky-header"></th>
                                <th>#</th>
                                <th>Book Title</th>
                                <th>Borrowers Name</th>
                                <th>Borrowed Date</th>
                                <th>Date Returned</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for return in returned_books %}
                            <tr>
                                <td>{{ loop.index }}</td>
                              
                                <td>{{ return[8] }}</td>
                                <td>{{return[6]}}, {{ return[5] }}</td>
                                <td>{{ return[3] }}</td>
                                <td>{{ return[1]}}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    $(document).ready(function () {
        // Search functionality
        $("#searchInput").on("keyup", function () {
            var searchText = $(this).val().toLowerCase(); // Get the value of the search input
            $("tbody tr").each(function () { // Loop through each table row
                var rowData = $(this).text().toLowerCase(); // Get the text content of the row and convert to lowercase
                if (rowData.indexOf(searchText) === -1) { // Check if the row data contains the search text
                    $(this).hide(); // Hide the row if it doesn't match the search
                } else {
                    $(this).show(); // Show the row if it matches the search
                }
            });
        });
    });
</script>
{% endblock %}
